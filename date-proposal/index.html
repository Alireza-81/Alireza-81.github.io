<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Question, For You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --midnight-a: #140b2e;
    --midnight-b: #2a1652;
    --midnight-c: #3d1f66;
    --blush: #ff8fb3;
    --blush-soft: #ffd1de;
    --gold: #ffcf7a;
    --gold-soft: #ffe6b3;
    --ink: #fff6ea;
    --ink-dim: rgba(255,246,234,0.72);
    --shadow-deep: rgba(10, 4, 26, 0.55);
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0; height:100%;
    background: radial-gradient(ellipse at 50% -10%, var(--midnight-c), var(--midnight-b) 45%, var(--midnight-a) 100%);
    color: var(--ink);
    font-family: 'Quicksand', sans-serif;
    overflow-x:hidden;
    transition: background 1.4s ease, color 1.2s ease;
  }

  body.mode-night{
    background: radial-gradient(ellipse at 50% -10%, #241147, #150a30 45%, #06030f 100%);
  }

  body.mode-morning{
    background: radial-gradient(ellipse at 50% -10%, #6fa8dc, #a9d0ea 45%, #ffd9a0 100%);
    color: #3b2b20;
  }
  body.mode-morning .ink-dim-text{ color: rgba(59,43,32,0.7); }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  }

  /* ---------- background scene ---------- */
  .scene{
    position: fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;
  }

  .celestial{ position:absolute; inset:0; transition: opacity 1.2s ease; }

  .moon{
    position:absolute; top: 6%; right: 8%;
    width: 130px; height:130px; border-radius:50%;
    background: radial-gradient(circle at 35% 32%, #fff9ec, var(--gold-soft) 55%, var(--gold) 100%);
    box-shadow: 0 0 60px 18px rgba(255, 214, 148, 0.35), 0 0 140px 60px rgba(255, 214, 148, 0.12);
    opacity:.9;
    transition: opacity 1.2s ease, box-shadow 1.2s ease;
  }
  @media (max-width: 640px){ .moon{ width:80px; height:80px; top:4%; right:6%; } }

  body.mode-night .moon{
    opacity: 1;
    box-shadow: 0 0 80px 26px rgba(255, 214, 148, 0.5), 0 0 200px 90px rgba(180, 160, 255, 0.16);
  }
  body.mode-morning .moon{ opacity:0; }

  .sun{
    position:absolute; top: 8%; right: 9%;
    width: 130px; height:130px; border-radius:50%;
    background: radial-gradient(circle at 35% 32%, #fffbe9, #ffd27a 55%, #ff9e5e 100%);
    box-shadow: 0 0 70px 22px rgba(255, 170, 90, 0.5), 0 0 170px 80px rgba(255, 170, 90, 0.2);
    opacity:0;
    transition: opacity 1.2s ease;
  }
  @media (max-width: 640px){ .sun{ width:80px; height:80px; top:4%; right:6%; } }
  body.mode-morning .sun{ opacity:1; }

  .stars-layer{ position:absolute; inset:0; transition: opacity 1.2s ease; }
  body.mode-morning .stars-layer{ opacity:0; }
  body.mode-night .stars-layer{ filter: brightness(1.4); }

  .star{
    position:absolute; border-radius:50%;
    background: var(--ink);
    animation: twinkle ease-in-out infinite;
  }
  @keyframes twinkle{
    0%, 100%{ opacity:.15; transform: scale(.7); }
    50%{ opacity:1; transform: scale(1.15); }
  }

  .petals-layer{ position:absolute; inset:0; transition: opacity 1s ease; }

  .petal{
    position:absolute; top:-40px;
    animation: fall linear infinite;
    opacity: .85;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
  }
  @keyframes fall{
    0%{ transform: translateY(-5vh) translateX(0) rotate(0deg); }
    100%{ transform: translateY(110vh) translateX(var(--drift, 40px)) rotate(340deg); }
  }

  /* ---------- layout ---------- */
  .stage{
    position: relative; z-index:1;
    min-height: 100vh;
    display:flex; align-items:center; justify-content:center;
    padding: 32px 20px;
  }

  .card{
    width: 100%; max-width: 560px;
    background: linear-gradient(165deg, rgba(255,255,255,0.09), rgba(255,255,255,0.03));
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 28px;
    padding: 48px 40px;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 30px 80px var(--shadow-deep);
    text-align:center;
    transition: background 1.2s ease, border-color 1.2s ease, box-shadow 1.2s ease;
  }
  @media (max-width: 480px){ .card{ padding: 36px 24px; border-radius: 22px; } }

  body.mode-morning .card{
    background: linear-gradient(165deg, rgba(255,255,255,0.55), rgba(255,255,255,0.32));
    border-color: rgba(255,255,255,0.6);
    box-shadow: 0 30px 80px rgba(180, 120, 40, 0.25);
  }
  body.mode-morning h1,
  body.mode-morning h2,
  body.mode-morning .field label,
  body.mode-morning .time-opt{ color: #3b2b20; }
  body.mode-morning .sub,
  body.mode-morning .status-msg,
  body.mode-morning .field input[type="text"]{ color: rgba(59,43,32,0.75); }
  body.mode-morning .eyebrow{ color: #b5651d; }
  body.mode-morning .field input[type="text"]{
    background: rgba(255,255,255,0.5); border-color: rgba(120,80,40,0.25);
  }
  body.mode-morning .time-opt{
    background: rgba(255,255,255,0.4); border-color: rgba(120,80,40,0.2);
  }
  body.mode-morning .error-msg{ color: #b5651d; }

  .panel{ display:none; }
  .panel.active{ display:block; animation: riseIn .7s cubic-bezier(.2,.8,.2,1); }
  @keyframes riseIn{
    from{ opacity:0; transform: translateY(18px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .eyebrow{
    letter-spacing: .22em; text-transform: uppercase;
    font-size: .72rem; color: var(--blush-soft);
    margin: 0 0 10px;
  }

  h1{
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600; font-style: italic;
    font-size: clamp(2rem, 6vw, 2.9rem);
    line-height: 1.15;
    margin: 0 0 8px;
    color: var(--ink);
  }

  h2{
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: clamp(1.6rem, 5vw, 2.1rem);
    margin: 0 0 6px;
  }

  .sub{
    color: var(--ink-dim); font-size: .98rem; margin: 0 0 30px;
  }

  /* ---------- buttons ---------- */
  .choice-row{
    position: relative;
    display:flex; gap:18px; justify-content:center; align-items:center;
    margin-top: 34px; min-height: 70px;
    flex-wrap: wrap;
  }

  button{ font-family: 'Quicksand', sans-serif; cursor:pointer; border:none; }

  .btn-yes{
    background: linear-gradient(135deg, var(--blush), #ff6fa0);
    color: #2a0f1f;
    font-weight: 700; font-size: 1.05rem;
    padding: 15px 34px;
    border-radius: 999px;
    box-shadow: 0 10px 30px rgba(255, 111, 160, 0.45);
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .btn-yes:hover{ transform: translateY(-2px) scale(1.03); box-shadow: 0 14px 36px rgba(255, 111, 160, 0.6); }
  .btn-yes:active{ transform: translateY(0) scale(.98); }
  .btn-yes:disabled{ opacity:.5; cursor:not-allowed; transform:none; box-shadow:none; }

  .btn-no{
    background: rgba(255,255,255,0.08);
    color: var(--ink-dim);
    font-weight: 600; font-size: 1rem;
    padding: 14px 30px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.18);
    transition: transform .15s ease;
    position: relative;
  }
  .btn-no.dodging{
    position: fixed; z-index: 50; margin:0;
    right: auto; bottom: auto;
    transition: left .12s linear, top .12s linear, opacity .5s ease, transform .5s ease;
    }

  .nudge{
    min-height: 26px; margin-top: 18px;
    color: var(--gold-soft); font-weight: 600; font-size: .95rem;
  }

  /* ---------- form ---------- */
  .field{ text-align:left; margin-bottom: 22px; }
  .field label{
    display:block; font-size: .82rem; letter-spacing:.04em;
    color: var(--ink-dim); margin-bottom: 8px; text-transform: uppercase;
  }
  .field input[type="text"]{
    width: 100%; padding: 13px 16px;
    border-radius: 12px; border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.06); color: var(--ink);
    font-family: 'Quicksand', sans-serif; font-size: 1rem;
    outline: none; transition: border-color .2s ease, background .2s ease;
  }
  .field input[type="text"]::placeholder{ color: rgba(255,246,234,0.4); }
  .field input[type="text"]:focus{ border-color: var(--blush); background: rgba(255,255,255,0.1); }
  .field input[type="text"]:focus-visible{ outline: 2px solid var(--gold); outline-offset: 2px; }

  .time-grid{
    display:grid; grid-template-columns: 1fr 1fr; gap: 12px;
  }
  @media (max-width: 420px){ .time-grid{ grid-template-columns: 1fr; } }

  .time-opt{
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.16);
    color: var(--ink);
    padding: 14px 12px; border-radius: 14px;
    font-size: .92rem; font-weight: 600;
    transition: all .18s ease;
    text-align:center;
  }
  .time-opt:hover{ background: rgba(255,255,255,0.12); }
  .time-opt:focus-visible{ outline: 2px solid var(--gold); outline-offset: 2px; }
  .time-opt.selected{
    background: linear-gradient(135deg, var(--blush), #ff6fa0);
    color: #2a0f1f; border-color: transparent;
    box-shadow: 0 8px 22px rgba(255,111,160,0.4);
  }

  .other-wrap{ margin-top: 14px; display:none; }
  .other-wrap.show{ display:block; }

  .error-msg{
    color: var(--gold-soft); font-size: .85rem; min-height: 20px; margin: 4px 0 0;
  }

  .submit-btn{ margin-top: 8px; width: 100%; }

  .status-msg{ margin-top: 14px; font-size: .88rem; color: var(--ink-dim); }

  .heart-burst{
    position:absolute; inset:0; pointer-events:none; overflow:visible;
  }
  .heart-burst span{
    position:absolute; left:50%; top:50%; font-size: 1.4rem;
    animation: burst 1s ease-out forwards;
  }
  @keyframes burst{
    to{ transform: translate(var(--bx), var(--by)) scale(0); opacity:0; }
  }

  .thanks-emoji{ font-size: 2.6rem; margin-bottom: 6px; }
</style>
</head>
<body>

<div class="scene" id="scene">
  <div class="celestial">
    <div class="moon"></div>
    <div class="sun"></div>
  </div>
  <div class="stars-layer" id="starsLayer"></div>
  <div class="petals-layer" id="petalsLayer"></div>
</div>

<div class="stage">
  <div class="card">

    <!-- STEP 1: the ask -->
    <section class="panel active" id="step-ask">
      <p class="eyebrow">A question, for you</p>
      <h1>Will you go out<br>on a date with me?</h1>
      <div class="choice-row" id="choiceRow">
        <button type="button" class="btn-yes" id="yesBtn">Yes 💛</button>
        <button type="button" class="btn-no" id="noBtn">No</button>
      </div>
      <p class="nudge" id="nudge">&nbsp;</p>
    </section>

    <!-- STEP 2: details -->
    <section class="panel" id="step-details">
      <h2>Wonderful. A few details…</h2>
      <p class="sub">Just so I know who to show up for, and when.</p>

      <form id="detailsForm">
        <div class="field">
          <label for="nameInput">Your name</label>
          <input type="text" id="nameInput" name="name" placeholder="Tell me your name" required>
        </div>

        <div class="field">
          <label>When are you free?</label>
          <div class="time-grid" id="timeGrid">
            <button type="button" class="time-opt" data-value="Tonight" data-mode="night">Tonight</button>
            <button type="button" class="time-opt" data-value="Tomorrow morning" data-mode="morning">Tomorrow morning</button>
            <button type="button" class="time-opt" data-value="Tomorrow night" data-mode="night">Tomorrow night</button>
            <button type="button" class="time-opt" data-value="Other" data-mode="neutral">None of the above</button>
          </div>
          <div class="other-wrap" id="otherWrap">
            <input type="text" id="otherInput" placeholder="Propose a time that works for you">
          </div>
          <p class="error-msg" id="errorMsg">&nbsp;</p>
        </div>

        <input type="hidden" name="answer" value="Yes">
        <input type="hidden" name="_subject" value="💌 New date response!">
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_template" value="table">

        <button type="submit" class="btn-yes submit-btn" id="submitBtn">Send it 💌</button>
        <p class="status-msg" id="statusMsg">&nbsp;</p>
      </form>
    </section>

    <!-- STEP 3: thanks -->
    <section class="panel" id="step-thanks">
      <div class="thanks-emoji">🌹</div>
      <h2 id="thanksTitle">Sealed with a heart.</h2>
      <p class="sub" id="thanksSub">I can't wait. I'll see you soon.</p>
    </section>

  </div>
</div>

<script>
/* ======================================================
   CONFIGURATION — replace with your own email address
   ====================================================== */
const RECEIVER_EMAIL = "alireza81.amiri@gmail.com"; // <-- put your email here

/* ---------- background: stars + petals ---------- */
const starsLayer = document.getElementById('starsLayer');
const petalsLayer = document.getElementById('petalsLayer');

function makeStars(count){
  for(let i=0;i<count;i++){
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random()*2.4 + 1;
    s.style.width = size+'px';
    s.style.height = size+'px';
    s.style.top = Math.random()*100+'vh';
    s.style.left = Math.random()*100+'vw';
    s.style.animationDuration = (Math.random()*3 + 2)+'s';
    s.style.animationDelay = (Math.random()*4)+'s';
    starsLayer.appendChild(s);
  }
}

const petalEmojis = ['🌸','🌷','🌺','✨'];
function makePetals(count){
  for(let i=0;i<count;i++){
    const p = document.createElement('div');
    p.className = 'petal';
    p.textContent = petalEmojis[Math.floor(Math.random()*petalEmojis.length)];
    p.style.left = Math.random()*100+'vw';
    p.style.fontSize = (Math.random()*10+14)+'px';
    p.style.setProperty('--drift', (Math.random()*160-80)+'px');
    p.style.animationDuration = (Math.random()*10+12)+'s';
    p.style.animationDelay = (Math.random()*14)+'s';
    petalsLayer.appendChild(p);
  }
}

makeStars(70);
makePetals(16);

/* ---------- step 1: proximity-jump No button ---------- */
const yesBtn = document.getElementById('yesBtn');
const noBtn = document.getElementById('noBtn');
const nudge = document.getElementById('nudge');
const choiceRow = document.getElementById('choiceRow');

const nudgeLines = [
  "Almost had it.",
  "So close, and yet.",
  "Yes is right there, though.",
  "This one's a slippery little button.",
  "One more try?",
  "It really doesn't want to be clicked."
];
const DODGE_RADIUS = 85;
const REARM_RADIUS = 135;
let attemptCount = 0;
let dodgeArmed = true;

function moveNoButtonRandomly(cursorX, cursorY){
  if(!noBtn.isConnected) return;

  // Preserve its exact screen position, then move it under <body> so fixed
  // coordinates are always relative to the real browser viewport.
  if(!noBtn.classList.contains('dodging')){
    const initialRect = noBtn.getBoundingClientRect();
    document.body.appendChild(noBtn);
    noBtn.classList.add('dodging');
    noBtn.style.width = initialRect.width + 'px';
    noBtn.style.left = initialRect.left + 'px';
    noBtn.style.top = initialRect.top + 'px';
  }

  const rect = noBtn.getBoundingClientRect();
  const margin = 24;
  const viewportWidth = document.documentElement.clientWidth;
  const viewportHeight = document.documentElement.clientHeight;
  const maxX = Math.max(margin, viewportWidth - rect.width - margin);
  const maxY = Math.max(margin, viewportHeight - rect.height - margin);

  let x = margin;
  let y = margin;
  let tries = 0;

  // Pick a point well away from both the current button and the cursor.
  do {
    x = margin + Math.random() * Math.max(0, maxX - margin);
    y = margin + Math.random() * Math.max(0, maxY - margin);
    const newCenterX = x + rect.width / 2;
    const newCenterY = y + rect.height / 2;
    const farFromCurrent = Math.hypot(x - rect.left, y - rect.top) >= 140;
    const farFromCursor = Math.hypot(newCenterX - cursorX, newCenterY - cursorY) >= 170;
    if(farFromCurrent && farFromCursor) break;
    tries++;
  } while(tries < 40);

  x = Math.max(margin, Math.min(maxX, x));
  y = Math.max(margin, Math.min(maxY, y));
  noBtn.style.left = Math.round(x) + 'px';
  noBtn.style.top = Math.round(y) + 'px';

  attemptCount++;
  nudge.textContent = nudgeLines[(attemptCount - 1) % nudgeLines.length];
}

document.addEventListener('mousemove', (e)=>{
  if(!noBtn.isConnected) return;

  const rect = noBtn.getBoundingClientRect();
  const centerX = rect.left + rect.width / 2;
  const centerY = rect.top + rect.height / 2;
  const distance = Math.hypot(e.clientX - centerX, e.clientY - centerY);

  if(distance <= DODGE_RADIUS && dodgeArmed){
    dodgeArmed = false;
    moveNoButtonRandomly(e.clientX, e.clientY);
    return;
  }

  if(distance >= REARM_RADIUS){
    dodgeArmed = true;
  }
});

// Touch devices have no cursor proximity, so tapping performs one jump.
noBtn.addEventListener('click', (e)=>{
  e.preventDefault();
  moveNoButtonRandomly(window.innerWidth / 2, window.innerHeight / 2);
});

// Keep it in bounds if the browser is resized after it has moved.
window.addEventListener('resize', ()=>{
  if(!noBtn.isConnected || !noBtn.classList.contains('dodging')) return;

  const rect = noBtn.getBoundingClientRect();
  const margin = 24;
  const viewportWidth = window.visualViewport?.width ?? document.documentElement.clientWidth;
  const viewportHeight = window.visualViewport?.height ?? document.documentElement.clientHeight;
  const maxX = Math.max(margin, viewportWidth - rect.width - margin);
  const maxY = Math.max(margin, viewportHeight - rect.height - margin);

  noBtn.style.left = Math.max(margin, Math.min(maxX, rect.left)) + 'px';
  noBtn.style.top = Math.max(margin, Math.min(maxY, rect.top)) + 'px';
});

function heartBurst(originEl){
  const burst = document.createElement('div');
  burst.className = 'heart-burst';
  const rect = originEl.getBoundingClientRect();
  burst.style.position = 'fixed';
  burst.style.left = rect.left+'px';
  burst.style.top = rect.top+'px';
  burst.style.width = rect.width+'px';
  burst.style.height = rect.height+'px';
  document.body.appendChild(burst);
  for(let i=0;i<10;i++){
    const h = document.createElement('span');
    h.textContent = ['💛','✨','🌸'][Math.floor(Math.random()*3)];
    const angle = Math.random()*Math.PI*2;
    const dist = 60 + Math.random()*60;
    h.style.setProperty('--bx', Math.cos(angle)*dist+'px');
    h.style.setProperty('--by', Math.sin(angle)*dist+'px');
    h.style.animationDelay = (Math.random()*.15)+'s';
    burst.appendChild(h);
  }
  setTimeout(()=> burst.remove(), 1200);
}

const stepAsk = document.getElementById('step-ask');
const stepDetails = document.getElementById('step-details');
const stepThanks = document.getElementById('step-thanks');

yesBtn.addEventListener('click', ()=>{
  heartBurst(yesBtn);
  setTimeout(()=>{
    stepAsk.classList.remove('active');
    stepDetails.classList.add('active');
  }, 250);
});

/* ---------- step 2: time selection ---------- */
const timeGrid = document.getElementById('timeGrid');
const otherWrap = document.getElementById('otherWrap');
const otherInput = document.getElementById('otherInput');
const errorMsg = document.getElementById('errorMsg');
let selectedTime = null;

timeGrid.addEventListener('click', (e)=>{
  const btn = e.target.closest('.time-opt');
  if(!btn) return;
  [...timeGrid.children].forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
  selectedTime = btn.dataset.value;
  errorMsg.textContent = '\u00a0';

  if(selectedTime === 'Other'){
    otherWrap.classList.add('show');
    otherInput.focus();
  } else {
    otherWrap.classList.remove('show');
  }

  // shift the whole scene's mood to match the time of day picked
  document.body.classList.remove('mode-night', 'mode-morning');
  const mode = btn.dataset.mode;
  if(mode === 'night') document.body.classList.add('mode-night');
  else if(mode === 'morning') document.body.classList.add('mode-morning');
});

/* ---------- step 2: submit + email ---------- */
const form = document.getElementById('detailsForm');
const submitBtn = document.getElementById('submitBtn');
const statusMsg = document.getElementById('statusMsg');
const thanksTitle = document.getElementById('thanksTitle');
const thanksSub = document.getElementById('thanksSub');
const nameInput = document.getElementById('nameInput');

form.addEventListener('submit', async (e)=>{
  e.preventDefault();
  errorMsg.textContent = '\u00a0';

  const name = nameInput.value.trim();
  if(!name){
    errorMsg.textContent = 'Please tell me your name first.';
    nameInput.focus();
    return;
  }
  if(!selectedTime){
    errorMsg.textContent = 'Please pick a time (or suggest one).';
    return;
  }
  let finalTime = selectedTime;
  if(selectedTime === 'Other'){
    const suggestion = otherInput.value.trim();
    if(!suggestion){
      errorMsg.textContent = 'Go ahead and suggest a time that works.';
      otherInput.focus();
      return;
    }
    finalTime = 'Other — ' + suggestion;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = 'Sending…';
  statusMsg.textContent = '\u00a0';

  const payload = new FormData();
  payload.append('name', name);
  payload.append('answer', 'Yes');
  payload.append('free_time', finalTime);
  payload.append('_subject', '💌 ' + name + ' answered your date question!');
  payload.append('_captcha', 'false');
  payload.append('_template', 'table');

  try{
    const res = await fetch('https://formsubmit.co/ajax/' + encodeURIComponent(RECEIVER_EMAIL), {
      method: 'POST',
      headers: { 'Accept': 'application/json' },
      body: payload
    });
    if(!res.ok) throw new Error('Request failed');

    thanksTitle.textContent = 'Sealed with a heart, ' + name + '.';
    thanksSub.textContent = "I've got it — " + finalTime.toLowerCase() + ". I can't wait to see you.";
    stepDetails.classList.remove('active');
    stepThanks.classList.add('active');
  } catch(err){
    submitBtn.disabled = false;
    submitBtn.textContent = 'Send it 💌';
    statusMsg.innerHTML = "Hmm, the message didn't send. Try again, or reach out directly at "
      + '<a href="mailto:'+RECEIVER_EMAIL+'" style="color: var(--gold-soft);">'+RECEIVER_EMAIL+'</a>.';
  }
});
</script>
</body>
</html>
